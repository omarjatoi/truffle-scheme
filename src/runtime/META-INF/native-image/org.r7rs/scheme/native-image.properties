# Building the language into a native image (design.md D17, `bazel build //:scheme-native`).
#
# The language's classes are initialized at image build time, as GraalVM's own languages' are:
# their instances (the language provider, the DSL-generated library exports, constant values) live
# in the image heap. So static state keeps its build-time value: in a native image,
# SchemeRootNode.TORTURE (the scheme.torture property) is false and PreludeImage.ENABLED
# (scheme.preludeImage) is true, whatever the command line says. PreludeImage reads and checks the
# build-time prelude image (prelude.image, M7-05) when it is initialized, so the checked image is in
# the image heap and the executable doesn't read it.
#
# reachability-metadata.json beside this file includes the prelude and the standard libraries
# (src/prelude: .sld and .scm, not prelude.image), which the compiler reads as resources
# (SourceDir.Resources) when it doesn't restore from the image.
Args = --initialize-at-build-time=scheme.runtime,scheme.runtime.value,scheme.runtime.printer,scheme.runtime.staticobject,scheme.reader,scheme.compiler,scheme.builtins
