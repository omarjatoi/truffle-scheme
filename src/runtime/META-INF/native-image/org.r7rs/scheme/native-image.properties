# Building the language into a native image (design.md D17, `bazel build //:scheme-native`).
#
# The language's classes are initialized at image build time, as GraalVM's own languages' are:
# their instances (the language provider, the DSL-generated library exports, constant values) live
# in the image heap. So static state keeps its build-time value, the constant options' among it
# (scheme.Torture, scheme.PreludeImageFile, scheme.PreludeImageWrite: design.md D17, "Constant
# options"), which -Dpolyglot.<name> given to native-image sets and a run can't change.
# PreludeImage reads and checks the build-time prelude image (prelude.image, M7-05) when it is
# initialized, so the checked image is in the image heap and the executable doesn't read it.
#
# reachability-metadata.json beside this file includes the prelude and the standard libraries
# (src/prelude: .sld and .scm, not prelude.image), which the compiler reads as resources
# (SourceDir.Resources) when it doesn't restore from the image.
#
# MaxRuntimeCompileMethods is the language's share of the image's bound on methods reachable for
# runtime compilation, as GraalVM's languages declare theirs (SimpleLanguage 250, TRegex 900):
# native-image adds up every jar's, Truffle's runtime's 2700 among them, and a build that enforces
# the sum (-H:+EnforceMaxRuntimeCompileMethods, as //:scheme-native's does) fails past it. 300 makes
# //:scheme-native's bound 3,000: its count, 2,703, plus a margin (design.md D17, "Runtime-compiled
# methods").
Args = --initialize-at-build-time=scheme.runtime,scheme.runtime.value,scheme.runtime.printer,scheme.runtime.staticobject,scheme.reader,scheme.compiler,scheme.builtins \
       -H:MaxRuntimeCompileMethods=300
