# CI, uploaded by the pipeline's settings (`buildkite-agent pipeline upload`), for every commit,
# on Buildkite's hosted linux-small agents (2 vCPUs, the default queue), in CI's agent image (the
# queue's image: nix/image.nix, Determinate Nix with the CI dev shell in its store).
# hooks/pre-command loads the CI dev shell (flake.nix .#ci: just Bazel) and writes Bazel's CI
# settings and the BuildBuddy key (the cluster secret BUILDBUDDY_API_KEY) to the agent's
# ~/.bazelrc, so the steps are plain `bazel` commands. Actions and tests run on BuildBuddy's
# executors (.bazelrc --config=remote, the default); the `buildbuddy` annotation links this
# commit's invocations.
#
# Main requires the build's status, `buildkite/truffle-scheme`, which `checks` and `tests` fail
# (and, on main only, `image`); each also posts its own, `buildkite/truffle-scheme/<key>`. One
# bazel command per step: the parallelism is Bazel's, on the executors.

secrets:
  - BUILDBUDDY_API_KEY

# Bazel's repository cache (the downloads: GraalVM, Maven jars, Python) and bazelisk's Bazel,
# kept between builds.
cache:
  name: bazel
  paths:
    - /root/.cache/bazel-repository-cache
    - /root/.cache/bazelisk

steps:
  - label: ":bazel: Checks"
    key: checks
    command: bazel test --build_tests_only --test_tag_filters=lint //...

  - label: ":bazel: Tests"
    key: tests
    timeout_in_minutes: 75
    command: bazel test --test_tag_filters=-lint //...

  # CI's agent image, built and pushed on main when its inputs change (.buildkite/push-image.sh,
  # docs/design.md D11), so that the queue's `latest` is main's. Never on pull requests. After the
  # tests, whatever their result, so that it never holds them up, and one build at a time, in
  # order, so that an older main never moves `latest` back.
  - label: ":docker: Agent image"
    key: image
    if: build.branch == "main" && build.pull_request.id == null
    if_changed:
      - flake.nix
      - flake.lock
      - nix/image.nix
    depends_on:
      - checks
      - tests
    allow_dependency_failure: true
    concurrency: 1
    concurrency_group: truffle-scheme/ci-image
    timeout_in_minutes: 60
    command: .buildkite/push-image.sh
