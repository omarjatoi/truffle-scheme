# CI, uploaded by the pipeline's settings (`buildkite-agent pipeline upload`). The agents are
# Buildkite's hosted Linux ones: hooks/pre-command installs Nix, and the commands run in its dev
# shell, as AGENTS.md "Commands" does.
#
# Required on main: the commit statuses `Checks` and `Tests`. The conformance tables are
# annotations and never fail a build. The benchmark check and the re-measure of its thresholds run
# only on demand: a build started with BENCH=check or BENCH=measure in its environment, or a push
# whose commit message says "[bench check]" or "[bench measure]" (bench/README.md "Thresholds").

# Bazel's disk and repository caches (.bazelrc --config=ci), kept between builds.
cache:
  name: bazel
  paths:
    - /root/.cache/bazel-disk-cache
    - /root/.cache/bazel-repository-cache

steps:
  - label: ":bazel: Checks"
    command:
      - nix develop --command bazel test --config=ci --build_tests_only --test_tag_filters=lint //...
    notify:
      - github_commit_status:
          context: Checks

  - label: ":bazel: Tests"
    agents:
      queue: linux-large
    command:
      - nix develop --command bazel test --config=ci --test_tag_filters=-lint //...
      - nix develop --command bazel run --config=ci //:r7rs -- readme
    notify:
      - github_commit_status:
          context: Tests

  - label: ":memo: Conformance (interpreter)"
    soft_fail: true
    command:
      - nix develop --command bazel run --config=ci //:r7rs -- test --markdown "$$PWD/conformance.md"
      - buildkite-agent annotate --context conformance-interpreter < conformance.md

  - label: ":memo: Conformance (compile)"
    soft_fail: true
    command:
      - nix develop --command bazel run --config=ci //:r7rs -- test --compile --markdown "$$PWD/conformance.md"
      - buildkite-agent annotate --context conformance-compile < conformance.md

  - label: ":stopwatch: Benchmark check"
    agents:
      queue: linux-medium
    if: build.env("BENCH") == "check" || build.message =~ /\[bench check\]/
    command:
      - nix develop --command bazel build --config=ci //:r7rs
      - nix develop --command bazel run --config=ci //:r7rs -- bench-check --json "$$PWD/bench-check.json" --markdown "$$PWD/bench-check.md"
    artifact_paths: bench-check.*

  - label: ":stopwatch: Measure %n"
    agents:
      queue: linux-medium
    key: measure
    if: build.env("BENCH") == "measure" || build.message =~ /\[bench measure\]/
    parallelism: 8
    command:
      - nix develop --command bazel build --config=ci //:r7rs
      - nix develop --command bazel run --config=ci //:r7rs -- bench-check --measure --json "$$PWD/measure-$$BUILDKITE_PARALLEL_JOB.json"
    artifact_paths: measure-*.json

  - label: ":stopwatch: Thresholds"
    if: build.env("BENCH") == "measure" || build.message =~ /\[bench measure\]/
    depends_on: measure
    command:
      - buildkite-agent artifact download "measure-*.json" runs/
      - |
        nix develop --command bazel run --config=ci //:r7rs -- bench-check --update --from "$$PWD"/runs/*.json \
          --note "$$(ls runs | wc -l) runs of Buildkite's Measure step (build $$BUILDKITE_BUILD_NUMBER), each on a fresh agent: $$(nproc) vCPUs ($$(lscpu | sed -n 's/^Model name: *//p')), $$(free -g | awk '/Mem:/ {print $$2}') GB"
    artifact_paths: bench/thresholds.json
