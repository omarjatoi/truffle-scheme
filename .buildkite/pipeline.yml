# CI, uploaded by the pipeline's settings (`buildkite-agent pipeline upload`), for every commit,
# on Buildkite's hosted linux-small agents (2 vCPUs, the default queue). hooks/pre-command installs
# Nix, loads the CI dev shell (flake.nix .#ci: just Bazel) and writes Bazel's CI settings and the
# BuildBuddy key (the cluster secret BUILDBUDDY_API_KEY) to the agent's ~/.bazelrc, so the steps
# are plain `bazel` commands. Actions and tests run on BuildBuddy's executors (.bazelrc
# --config=remote, the default); the `buildbuddy` annotation links this commit's invocations.
#
# Main requires the build's status, `buildkite/truffle-scheme`, which `checks` and `tests` fail;
# each also posts its own, `buildkite/truffle-scheme/<key>`. The conformance tests are among
# `tests` (a test per suite section and mode); their table is the `conformance` annotation.

secrets:
  - BUILDBUDDY_API_KEY

# Bazel's repository cache (the downloads: GraalVM, Maven jars, Python) and bazelisk's Bazel,
# kept between builds.
cache:
  name: bazel
  paths:
    - /root/.cache/bazel-repository-cache
    - /root/.cache/bazelisk

steps:
  - label: ":bazel: Checks"
    key: checks
    command: bazel test --build_tests_only --test_tag_filters=lint //...

  - label: ":bazel: Tests"
    key: tests
    timeout_in_minutes: 75
    command:
      - bazel test --test_tag_filters=-lint //... || status=$$?
      - bazel run //:r7rs -- conformance-report --markdown "$$PWD/conformance.md"
      - buildkite-agent annotate --context conformance < conformance.md
      - exit $${status:-0}
