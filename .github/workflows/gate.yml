name: gate

on:
  pull_request:          # every PR, including PRs stacked on other PRs
  push:
    branches: [main]
  merge_group:           # runs the gate in a merge queue, if the repo gets one
                         # (needs an organization-owned repo; see PR #1)

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # The dev shell provides everything: GraalVM CE 25.5 (JAVA_HOME), mx, Python, chibi-scheme.
      - uses: DeterminateSystems/determinate-nix-action@v3

      # Maven jars (Truffle, JUnit, checkstyle, ...) that mx downloads, keyed by the pinned versions.
      - uses: actions/cache@v4
        with:
          path: ~/.mx/cache
          key: mx-cache-${{ runner.os }}-${{ hashFiles('mx.r7rs/suite.py', 'flake.lock') }}
          restore-keys: mx-cache-${{ runner.os }}-

      - name: Dev shell
        run: nix develop --command sh -c 'java -version && mx --version'

      - name: mx gate
        run: nix develop --command mx gate
