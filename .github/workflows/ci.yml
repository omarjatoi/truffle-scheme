name: CI

on:
  pull_request:          # every PR, including PRs stacked on other PRs
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every job runs Bazel inside the Nix dev shell (AGENTS.md "Commands"). `--config=ci` keeps
# Bazel's disk cache (build outputs and test results) and repository cache (downloads) under
# ~/.cache, which actions/cache saves after each run: a PR restores its own last run's, or else
# main's, so it reruns only what it changed.
jobs:
  # Required check on main: the static checks (tests tagged lint), which build every project with
  # javac's warnings as errors.
  checks:
    name: Checks
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/determinate-nix-action@v3
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/bazel-disk-cache
            ~/.cache/bazel-repository-cache
          key: bazel-${{ runner.os }}-checks-${{ github.sha }}
          restore-keys: |
            bazel-${{ runner.os }}-checks-
            bazel-${{ runner.os }}-
      - name: Static checks (format, Checkstyle, ECJ, SpotBugs, rule 1, versions)
        run: nix develop --command bazel test --config=ci --build_tests_only --test_tag_filters=lint //...

  # Every other test, then the doc commands (docs/usage.md, docs/embedding.md), which run Bazel.
  bazel-test:
    name: Tests (bazel test)
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/determinate-nix-action@v3
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/bazel-disk-cache
            ~/.cache/bazel-repository-cache
          key: bazel-${{ runner.os }}-tests-${{ github.sha }}
          restore-keys: |
            bazel-${{ runner.os }}-tests-
            bazel-${{ runner.os }}-
      - name: Tests (unit in three modes, conformance and torture, diff, spec, space, tools)
        run: nix develop --command bazel test --config=ci --test_tag_filters=-lint //...
      - name: Doc commands and samples (docs/usage.md, docs/embedding.md)
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: nix develop --command bazel run --config=ci //:r7rs -- readme

  # Performance thresholds (M5-08): a benchmark subset, each program in a JVM of its own, one after
  # another, on a runner of its own, against bench/thresholds.json, whose baselines were measured on
  # this runner type (bench/README.md "Thresholds").
  benchmarks:
    name: Tests (benchmarks)
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/determinate-nix-action@v3
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/bazel-disk-cache
            ~/.cache/bazel-repository-cache
          key: bazel-${{ runner.os }}-benchmarks-${{ github.sha }}
          restore-keys: |
            bazel-${{ runner.os }}-benchmarks-
            bazel-${{ runner.os }}-
      - name: Build
        run: nix develop --command bazel build --config=ci //:r7rs
      - name: Benchmark thresholds (bench/thresholds.json)
        run: nix develop --command bazel run --config=ci //:r7rs -- bench-check --json "$PWD/bench-check.json" --markdown "$GITHUB_STEP_SUMMARY"
      # The measurements, which `bench-check --update --from` turns into new thresholds.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: bench-check-${{ github.run_attempt }}
          path: bench-check.json
          if-no-files-found: ignore

  # Required check on main: it passes only if both test jobs above passed.
  tests:
    name: Tests
    needs: [bazel-test, benchmarks]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Every test job passed
        env:
          RESULT: ${{ needs.bazel-test.result }} ${{ needs.benchmarks.result }}
        run: |
          echo "Test jobs: $RESULT"
          test "$RESULT" = "success success"

  # Progress tracking, not a merge gate: the main ruleset requires only Checks and Tests, and
  # continue-on-error keeps a failing run from marking the workflow red. Each run's per-section
  # tables (chibi's suite, then Larceny's) are in the workflow run summary.
  conformance:
    name: Conformance (${{ matrix.mode }})
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: interpreter
            flags: ""
          - mode: compile
            flags: "--compile"
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/determinate-nix-action@v3
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/bazel-disk-cache
            ~/.cache/bazel-repository-cache
          key: bazel-${{ runner.os }}-conformance-${{ github.sha }}
          restore-keys: |
            bazel-${{ runner.os }}-conformance-
            bazel-${{ runner.os }}-
      - name: Both conformance suites ${{ matrix.flags }}
        run: nix develop --command bazel run --config=ci //:r7rs -- test ${{ matrix.flags }} --markdown "$GITHUB_STEP_SUMMARY"
