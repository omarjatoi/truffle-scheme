name: CI

on:
  pull_request:          # every PR, including PRs stacked on other PRs
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The required check on main (ruleset): the full mx gate, i.e. build, style,
  # rule checks, unit tests, and the conformance status-block check.
  gate:
    name: Build and test (mx gate)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # The dev shell provides everything: GraalVM CE 25.5 (JAVA_HOME), mx, Python, chibi-scheme.
      - uses: DeterminateSystems/determinate-nix-action@v3

      # Maven jars (Truffle, JUnit, checkstyle, ...) that mx downloads, keyed by the pinned versions.
      - uses: actions/cache@v4
        with:
          path: ~/.mx/cache
          key: mx-cache-${{ runner.os }}-${{ hashFiles('mx.r7rs/suite.py', 'flake.lock') }}
          restore-keys: mx-cache-${{ runner.os }}-

      - name: Dev shell
        run: nix develop --command sh -c 'java -version && mx --version'

      - name: mx gate
        run: nix develop --command mx gate

  # Progress tracking, not a merge gate: the main ruleset requires only
  # "Build and test (mx gate)",
  # and continue-on-error keeps a failing run from marking the workflow red.
  # Each run's per-section table is in the workflow run summary.
  conformance:
    name: Conformance (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: interpreter
            flags: ""
          - mode: compile
            flags: "--compile"
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/determinate-nix-action@v3
      - uses: actions/cache@v4
        with:
          path: ~/.mx/cache
          key: mx-cache-${{ runner.os }}-${{ hashFiles('mx.r7rs/suite.py', 'flake.lock') }}
          restore-keys: mx-cache-${{ runner.os }}-
      - name: mx build
        run: nix develop --command mx build
      - name: mx r7rs-test ${{ matrix.flags }}
        run: nix develop --command mx r7rs-test ${{ matrix.flags }} --markdown "$GITHUB_STEP_SUMMARY"
