name: Native launcher

# The native-image `scheme` launcher (plan.md M6-06, design.md D17): build it with the dev shell's
# GraalVM CE native-image (the release Bazel pins), time its startup, and check that it passes both
# conformance suites as the JVM launcher does (the status block in docs/plan.md). The build takes minutes and a few GB, so
# it isn't part of the required Checks and Tests: it runs by hand (Actions > Native launcher > Run
# workflow, or `gh workflow run native.yml`), weekly, and on PRs that change this file or the
# language's native-image configuration. The executable is the run's artifact.
on:
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * 1"   # Mondays 04:41 UTC
  pull_request:
    paths:
      - .github/workflows/native.yml
      - src/runtime/META-INF/native-image/**
      # Read and checked at image build time (design.md D17, M7-05).
      - src/compiler/scheme/compiler/PreludeImage.java
      - tests/harness/readme.py
      - bazel/graalvm.bzl
      - docs/usage.md
      - src/launcher/scheme/launcher/TerminalInput.java

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native launcher
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/determinate-nix-action@v3
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/bazel-disk-cache
            ~/.cache/bazel-repository-cache
          key: bazel-${{ runner.os }}-native-${{ github.sha }}
          restore-keys: |
            bazel-${{ runner.os }}-native-
            bazel-${{ runner.os }}-
      - name: Dev shell
        run: nix develop --command bazel --version
      - name: Build
        run: nix develop --command bazel build --config=ci //:r7rs
      # docs/usage.md's native-image blocks (M6-07): `bazel run //:r7rs -- native-image --output native/scheme`, then
      # a program run with native/scheme, checked against the README's output block.
      - name: native-image (docs/usage.md's native-image commands)
        run: nix develop --command bazel run --config=ci //:r7rs -- readme --native
      - name: Startup
        run: |
          printf '(import (scheme base) (scheme write))\n(display "hello")\n(newline)\n' > hello.scm
          test "$(native/scheme hello.scm)" = hello
          native/scheme --version
          python3 - >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import os, resource, statistics, subprocess, time
          print('### Native launcher startup\n')
          print(f'Median of 10 runs on the runner ({os.cpu_count()} vCPUs, shared): expect noise.\n')
          print('| Command | Wall time | Peak RSS |\n|---|---:|---:|')
          for args in (['--version'], ['hello.scm']):
              times = []
              for _ in range(10):
                  start = time.perf_counter()
                  subprocess.run(['native/scheme'] + args, stdout=subprocess.DEVNULL, check=True)
                  times.append(time.perf_counter() - start)
              rss = resource.getrusage(resource.RUSAGE_CHILDREN).ru_maxrss / 1024  # KB on Linux
              print(f'| `scheme {" ".join(args)}` | {statistics.median(times) * 1000:.0f} ms | {rss:.0f} MB |')
          print()
          EOF
      # The REPL on a pseudo-terminal (M7-07): JLine's line editing and history, on the JVM and natively.
      - name: REPL on a terminal
        run: SCHEME_NATIVE_LAUNCHER="$PWD/native/scheme" nix develop --command bazel run --config=ci //:r7rs -- tools terminal
      - name: Conformance through the native launcher
        run: nix develop --command bazel run --config=ci //:r7rs -- test --native native/scheme --markdown "$GITHUB_STEP_SUMMARY"
      - name: Passes what the status block says
        run: nix develop --command bazel run --config=ci //:r7rs -- status --check --native native/scheme
      - uses: actions/upload-artifact@v7
        with:
          name: scheme-native-linux-amd64
          path: native/scheme
          if-no-files-found: error
