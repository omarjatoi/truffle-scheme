name: Bazel

on:
  pull_request:          # every PR, including PRs stacked on other PRs
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: bazel-${{ github.ref }}
  cancel-in-progress: true

# The Bazel build (MODULE.bazel), next to the mx workflow (ci.yml) while both exist. The two jobs
# mirror mx's required checks: `Checks (Bazel)` builds the projects (javac -Werror) and runs the
# tests tagged `lint`, `Tests (Bazel)` builds everything and runs every other test. To make Bazel the required build,
# rename them `Checks` and `Tests` and delete ci.yml.
#
# Bazel runs inside the Nix dev shell, which provides bazelisk (as `bazel`, at .bazelversion) and
# chibi-scheme; Bazel downloads its own pinned GraalVM (bazel/graalvm.bzl), Maven jars and Python.
# Caching: `--config=ci` keeps a disk cache (action outputs and test results) and a repository
# cache (downloads) under ~/.cache, which actions/cache saves after each run and restores into
# the next. With a remote cache (BuildBuddy), `--config=remote` replaces both.
jobs:
  checks:
    name: Checks (Bazel)
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/determinate-nix-action@v3
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/bazel-disk-cache
            ~/.cache/bazel-repository-cache
          key: bazel-${{ runner.os }}-checks-${{ github.sha }}
          restore-keys: |
            bazel-${{ runner.os }}-checks-
            bazel-${{ runner.os }}-
      # --build_tests_only: build what the lint tests need, which is every project (javac,
      # warnings are errors), but not the conformance results that `bazel build //...` would run
      # (the status test's inputs; the Tests job builds those).
      - name: Build the projects (javac, warnings are errors) and run the static checks (tests tagged lint)
        run: nix develop --command bazel test --config=ci --build_tests_only --test_tag_filters=lint //...

  tests:
    name: Tests (Bazel)
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/determinate-nix-action@v3
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/bazel-disk-cache
            ~/.cache/bazel-repository-cache
          key: bazel-${{ runner.os }}-tests-${{ github.sha }}
          restore-keys: |
            bazel-${{ runner.os }}-tests-
            bazel-${{ runner.os }}-
      - name: Tests (unit in three modes, conformance, diff, spec, space, torture)
        run: nix develop --command bazel test --config=ci --test_tag_filters=-lint //...
      - name: Test results
        if: ${{ !cancelled() }}
        run: |
          {
            echo '### Conformance (interpreter only)'
            echo
            cat bazel-bin/tests/conformance_results_chibi.md bazel-bin/tests/conformance_results_larceny.md 2>/dev/null || echo '(not built)'
          } >> "$GITHUB_STEP_SUMMARY"
